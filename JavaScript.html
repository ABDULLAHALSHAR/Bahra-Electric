<script>
let currentUser = null;
let currentCourse = null;
let allCourses = [];
let examAnswers = {};

function showLoader(show=true){
  document.getElementById("loader").classList.toggle("hidden", !show);
}

function gas(fn, ...args){
  return new Promise((resolve,reject)=>{
    showLoader(true);
    google.script.run
      .withSuccessHandler(result=>{showLoader(false); resolve(result);})
      .withFailureHandler(err=>{showLoader(false); reject(new Error(err.message || err));})
      [fn](...args);
  });
}

async function login(){
  const employeeID = document.getElementById("employeeID").value.trim();
  const pin = document.getElementById("pin").value.trim();
  const msg = document.getElementById("loginMsg");
  msg.textContent = "";

  if(!employeeID || !pin){
    msg.textContent = "أدخل الرقم الوظيفي وPIN";
    return;
  }

  try{
    currentUser = await gas("login", employeeID, pin);
    sessionStorage.setItem("bahraUser", JSON.stringify(currentUser));

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userName").textContent = currentUser.name || "";
    document.getElementById("userRole").textContent = currentUser.role || "";

    await refreshAll();
  }catch(err){
    msg.textContent = err.message;
  }
}

function logout(){
  sessionStorage.removeItem("bahraUser");
  location.reload();
}

async function refreshAll(){
  await Promise.all([
    loadDashboard(),
    loadCourses(),
    loadMyRequests(),
    loadMyCourses()
  ]);
}

async function loadDashboard(){
  const d = await gas("getDashboard", currentUser.employeeID);
  document.getElementById("kpiEmployees").textContent = d.employees;
  document.getElementById("kpiCourses").textContent = d.courses;
  document.getElementById("kpiRequests").textContent = d.requests;
  document.getElementById("kpiCertificates").textContent = d.certificates;
}

async function loadCourses(){
  allCourses = await gas("getCourses");
  renderCourses(allCourses);
  document.getElementById("homeCourseList").innerHTML = allCourses.slice(0,6).map(courseCard).join("");
}

function renderCourses(list){
  document.getElementById("courseList").innerHTML =
    list.length ? list.map(courseCard).join("") : '<div class="empty">لا توجد دورات</div>';
}

function courseCard(c){
  return `
    <div class="course-card">
      <span class="tag">${esc(c.category || "Course")}</span>
      <h3>${esc(c.name || "")}</h3>
      <p>${esc(c.objective || "")}</p>
      <div class="meta">${esc(c.hours || "")} ساعة · ${esc(c.level || "")}</div>
      <button class="primary" onclick="requestCourse('${esc(c.id)}')">طلب الدورة</button>
    </div>
  `;
}

function filterCourses(){
  const q = document.getElementById("courseSearch").value.trim().toLowerCase();
  const list = allCourses.filter(c =>
    String(c.name || "").toLowerCase().includes(q) ||
    String(c.category || "").toLowerCase().includes(q)
  );
  renderCourses(list);
}

async function requestCourse(courseID){
  try{
    const d = await gas("submitTrainingRequest", currentUser.employeeID, courseID);
    alert(d.message);
    await loadMyRequests();
    await loadDashboard();
  }catch(err){
    alert(err.message);
  }
}

async function loadMyRequests(){
  const list = await gas("getMyRequests", currentUser.employeeID);
  const box = document.getElementById("requestList");
  box.innerHTML = list.length ? list.map(r=>`
    <div class="row-card">
      <div>
        <strong>${esc(r.courseName)}</strong>
        <div class="meta">${esc(r.date || "")}</div>
      </div>
      <span>${esc(r.status || "")}</span>
    </div>
  `).join("") : '<div class="empty">لا توجد طلبات</div>';
}

async function loadMyCourses(){
  const list = await gas("getMyCourses", currentUser.employeeID);
  const box = document.getElementById("myCourseList");
  box.innerHTML = list.length ? list.map(c=>`
    <div class="course-card">
      <h3>${esc(c.courseName)}</h3>
      <div class="meta">${esc(c.status || "")} · ${Number(c.progress || 0)}%</div>
      <div class="progress"><span style="width:${Number(c.progress || 0)}%"></span></div>
      <button class="primary" onclick="openCourse('${esc(c.courseID)}')">فتح الدورة</button>
    </div>
  `).join("") : '<div class="empty">لا توجد دورات مسجلة</div>';
}

async function openCourse(courseID){
  try{
    currentCourse = await gas("getCourseDetails", courseID);
    document.getElementById("playerTitle").textContent = currentCourse.name;
    document.getElementById("moduleList").innerHTML = currentCourse.modules.length ?
      currentCourse.modules.map(m=>`
        <div class="module-card">
          <div>
            <strong>${esc(m.title || "")}</strong>
            <p>${esc(m.description || "")}</p>
          </div>
          <button class="primary" onclick="completeOneModule('${esc(m.id)}')">إكمال</button>
        </div>
      `).join("") : '<div class="empty">لا يوجد محتوى للدورة</div>';

    document.getElementById("coursePlayer").classList.remove("hidden");
    showTab("myCoursesTab");
  }catch(err){
    alert(err.message);
  }
}

async function completeOneModule(moduleID){
  try{
    const progress = await gas(
      "completeModule",
      currentUser.employeeID,
      currentCourse.id,
      moduleID
    );
    document.getElementById("playerProgress").textContent = progress + "%";
    await loadMyCourses();
  }catch(err){
    alert(err.message);
  }
}

async function startExam(){
  try{
    if(!currentCourse) return alert("افتح الدورة أولاً");

    const d = await gas("getExam", currentUser.employeeID, currentCourse.id);
    examAnswers = {};

    document.getElementById("examQuestions").innerHTML = d.questions.map((q,i)=>`
      <div class="question-card">
        <h4>${i+1}. ${esc(q.question)}</h4>
        ${q.options.map(o=>`
          <label>
            <input type="radio" name="q_${esc(q.id)}"
              onchange="examAnswers['${esc(q.id)}']='${esc(o.key)}'">
            ${esc(o.text)}
          </label>
        `).join("")}
      </div>
    `).join("");

    document.getElementById("examBox").classList.remove("hidden");
  }catch(err){
    alert(err.message);
  }
}

async function submitExamNow(){
  try{
    const d = await gas(
      "submitExam",
      currentUser.employeeID,
      currentCourse.id,
      examAnswers
    );

    document.getElementById("examResult").innerHTML = `
      <div class="${d.result === "Pass" ? "success-box" : "danger-box"}">
        <strong>${d.result === "Pass" ? "ناجح" : "لم تحقق درجة النجاح"}</strong>
        <div>الدرجة: ${d.score}%</div>
        ${d.certificateID ? `<div>رقم الشهادة: ${esc(d.certificateID)}</div>` : ""}
      </div>
    `;

    await loadDashboard();
  }catch(err){
    alert(err.message);
  }
}

async function loadCertificates(){
  try{
    const list = await gas("getCertificates", currentUser.employeeID);
    const box = document.getElementById("certificateList");
    box.innerHTML = list.length ? list.map(c=>`
      <div class="certificate-card">
        <strong>${esc(c.courseName)}</strong>
        <div class="meta">الدرجة: ${esc(c.score)}% · ${esc(c.date || "")}</div>
        <div>${esc(c.id)}</div>
      </div>
    `).join("") : '<div class="empty">لا توجد شهادات</div>';
  }catch(err){
    alert(err.message);
  }
}

async function loadNotifications(){
  try{
    const list = await gas("getNotifications", currentUser.employeeID);
    const box = document.getElementById("notificationList");
    box.innerHTML = list.length ? list.map(n=>`
      <div class="notification-card">
        <strong>${esc(n.title)}</strong>
        <p>${esc(n.message || "")}</p>
        <div class="meta">${esc(n.date || "")}</div>
      </div>
    `).join("") : '<div class="empty">لا توجد إشعارات</div>';
  }catch(err){
    alert(err.message);
  }
}

function showTab(id, btn=null){
  document.querySelectorAll(".tab-section").forEach(s=>s.classList.add("hidden"));
  const el = document.getElementById(id);
  if(el) el.classList.remove("hidden");

  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.addEventListener("DOMContentLoaded", async()=>{
  const saved = sessionStorage.getItem("bahraUser");
  if(saved){
    try{
      currentUser = JSON.parse(saved);
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("userName").textContent = currentUser.name || "";
      document.getElementById("userRole").textContent = currentUser.role || "";
      await refreshAll();
    }catch(e){
      sessionStorage.removeItem("bahraUser");
    }
  }
});
</script>
